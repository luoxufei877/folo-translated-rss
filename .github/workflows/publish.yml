name: Build translated RSS feeds

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC 03:30 / 11:30 = Beijing 11:30 / 19:30
    - cron: "30 3,11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - name: Build Chinese RSS feeds
        env:
          AI_API_KEY: ${{ secrets.RSS_TRANSLATE }}
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo}"
          fi
          python build_translated_rss.py \
            --sources sources.json \
            --lookback-days 4 \
            --max-per-source 12 \
            --max-per-category 160 \
            --public-base-url "$base"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
